defaultBaseImage: gcr.io/distroless/static-debian13

defaultPlatforms:
  - linux/amd64
  - linux/arm64

baseImageOverrides:
  github.com/agent-substrate/substrate/demos/sandbox: alpine
  github.com/agent-substrate/substrate/demos/agent-secret: alpine
  # ateom-microvm needs glibc (for the fetched cloud-hypervisor binary) and mount/umount
  # (to bind the image into the virtiofsd shared dir) — both in debian:stable-slim but
  # not in the distroless static default.
  github.com/agent-substrate/substrate/cmd/ateom-microvm: debian:stable-slim
  # The image-streaming demo builds the counter server onto a deliberately large
  # base so there is a heavy rootfs worth streaming: on a cold node the
  # pull+unpack path struggles (or, for the biggest base, can't materialize the
  # rootfs before the resume deadline), while streaming mounts it instantly and
  # pages content in on demand. The counter binary is pure-Go static so any base
  # works; ko copies the base layers into KO_DOCKER_REPO at build time, so the
  # result is self-contained/streamable and the runtime worker identity only
  # needs read on your own repo. Build-time read of these bases needs
  # gke-ai-eco-dev/hicard access (granted to google.com users).
  #
  # Three sizes to choose from (uncomment exactly one; bigger = starker
  # streaming win but slower one-time ko build, which copies the base layers).
  # hicard's smallest eval images are ~1.1 GB, so there is no true 900 MB option.
  #
  # ~1.1 GB:
  # github.com/agent-substrate/substrate/demos/streaming/counterheavy: us-docker.pkg.dev/gke-ai-eco-dev/hicard/mldataset_nongoogle_swe_rebench/swerebench/sweb.eval.x86_64.nephila_1776_python-taiga-193@sha256:436ac710e243a394c5ec212910219357943d971bdba108698c2af029dc62babe
  # ~1.3 GB:
  # github.com/agent-substrate/substrate/demos/streaming/counterheavy: us-docker.pkg.dev/gke-ai-eco-dev/hicard/mldataset_nongoogle_swe_rebench/swerebench/sweb.eval.x86_64.pdm-project_1776_pdm-3377@sha256:a6d4b9839a2f7069f82be1cbef60615172659dcba63c4ea485508534a0fe56ad
  # ~8 GB (active):
  github.com/agent-substrate/substrate/demos/streaming/counterheavy: us-docker.pkg.dev/gke-ai-eco-dev/hicard/mldataset_nongoogle_swe_rebench/swerebench/sweb.eval.x86_64.allenai_1776_rslearn-142@sha256:33b7de04245c8bac360fba3e472c55040cd4d216a29c8794c461eeaa51633695

